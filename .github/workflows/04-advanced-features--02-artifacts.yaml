name: Artifacts
on:
  workflow_dispatch:

run-name: plugins practice

env:
  MY_NAME: ${{ secrets.MY_NAME }}

jobs:
  artifact-producer:
    name: Produce artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Create artifact file
        run: |
          echo "This will be stored as an artifact!" > artifact.txt
          echo "Generated by artifact-producer job on $(date) by $MY_NAME " >> artifact.txt

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: package-artifact
          path: artifact.txt

  artifact-consumer:
    name: Consume artifact
    runs-on: ubuntu-24.04
    needs: artifact-producer
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: package-artifact

      - name: Cat artifact file
        run: cat artifact.txt
