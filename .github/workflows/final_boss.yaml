name: Consistency

run-name: click me

jobs:

  first:
    name: analyzer
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.myChoice.outputs.target_env }}
      build_number: ${{ steps.myChoice.outputs.build_number }}
    steps:
      - id: myChoice
        name: intializing variables
        run: | 
          env_name=production
          version_id=105
          echo "target_env=${env_name}" >> "$GITHUB_OUTPUT"
          echo "build_number=${version_id}" >> "$GITHUB_OUTPUT"
  
  second:
    name: deployer
    runs-on: ubuntu-latest
    needs: first
    env:
      DEPLOY_KEY: auth_token_99
    steps:
      - run: echo " Deploying build ${{ needs.first.outputs.build_number }} to ${{ needs.first.outputs.target_env }} environment using key ${DEPLOY_KEY} "


    